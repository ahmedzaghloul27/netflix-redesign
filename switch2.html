<!DOCTYPE html>
<html>
<head>
  <title>Netflix - Who's Watching</title>
  <style>
    body {
      background-color: #141414;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .logo {
      width: 100px;
    }
    
    .manage-button {
      padding: 10px 20px;
      background-color: red;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    
    .user-grid {
  margin-left: 300px;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 30px;
  flex-wrap: wrap; 
  flex-direction: row; 
}
    
    .user-card {
      width: 100px;
      height: 100px;
      background-color: #333333;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }
    
    .user-card img {
      width: 100%;
      height: auto;
      border-radius: 5px 5px 0 0;
      cursor: pointer;
      filter: blur(2px); 
    }
    
    .user-card .edit-icon {
      position: absolute;
      top: 5px;
      right: 5px;
      color: white;
      font-size: 16px;
    }
    
    .user-card h2 {
      margin: 10px 0;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }
    
    .add-profile {
      margin-left: 20px;
      width: 50px;
      height: 50px;
      background-color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
    }
    
    
    .add-profile span {
      font-size: 40px;
    }
    .add-profile a{
      text-decoration: none;
    }
    
    .add-profile-text {
      margin-top: -20px;
      margin-left: 580px;
      font-size: 20px;
      color: white;
      font-weight: bold;
      text-align: center;
    }
    
    .done-button {
      background-color: red;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      display: block;
      margin: 30px auto 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="logo" src="./imgs/netflix_logo.png" alt="Netflix Logo">
    </div>
    <div class="container">
      <h1>Manage Profiles:</h1>
      
      <div class="user-grid">
        <div class="user-card">
          <a href="#">
            <img src="./imgs/oss.jpg" alt="User 1" class="blur-image">
            <span class="edit-icon">&#9998;</span>
          </a>
          <h2>Mohammed</h2>
        </div>
        <div class="user-card">
          <a href="#">
            <img src="./imgs/zaghlol.jpg" alt="User 2" class="blur-image">
            <span class="edit-icon">&#9998;</span>
          </a>
          <h2>Ahmed</h2>
        </div>
        <div class="user-card">
          <a href="#">
            <img src="./imgs/gasser.jpg" alt="User 3" class="blur-image">
            <span class="edit-icon">&#9998;</span>
          </a>
          <h2>Gasser</h2>
        </div>
        <div class="user-card">
          <a href="#">
            <img src="./imgs/ziad.jpg" alt="User 4" class="blur-image">
            <span class="edit-icon">&#9998;</span>
          </a>
          <h2>Ziad</h2>
        </div>
        <div class="add-profile">
          <a href="#">
            <span>+</span>
          </a>
        </div>
      </div>
      <div class="add-profile-text">Add Profile</div>
    </div>
    <button class="done-button" onclick="window.location.href = 'switch1.html';">Done</button>
  </div>
</body>
</html>
