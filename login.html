<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500&display=swap" rel="stylesheet">
  <link rel="Stylesheet" href="stylesheet.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <title>Document</title>
</head>
<body>
  <section class="splashscreen-login">
    <div class="splashscreen-login-blacked">
        <img src="css/photos/Netflix_logo.png" class="netflix-logo" alt="netflix logo"> 
      <div class="sign-in">
        <form>
            <p>Sign In</p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Sign In</button>
            <div class="forgot-password">
                <a href="#">Forgot your password?</a>
            </div>
            <div class="create-account">
                <p>New to Netflix? <a href="#">Sign up now</a>.</p>
            </div>
        </form>
    </div>
    </div>
	</section>
    
    <footer>
      <div class="footer-content">
      <div class="text-groups">
        <div class="text">
        <a href="#">Company</a>
        <a href="#">About us</a>
        <a href="#">Contact us</a>
        <a href="#">Careers</a>
      </div>
      <div class="text">
        <a href="#">Product</a>
        <a href="#">Pricing</a>
        <a href="#">Newsletter</a>
        <a href="#">Collaborations</a>
      </div>
      <div class="text">
        <a href="#">Information</a>
        <a href="#">FAQ</a>
        <a href="#">Blog</a>
        <a href="#">Support</a>
      </div>
      <div class="subscribe">
          <p>Subscribe</p>
        <form>
          <input type="email" name="email address" placeholder="Email address">
        </form>
       </div>
      </div>
      <hr>
      <div class="footer-bottom-content">
        <img class="logo-footer" src="css/photos/Netflix_logo.png" alt="netlfix">
        <div class="text-bottom">
        <a href="#">Information</a>
        <a href="#">FAQ</a>
        <a href="#">Blog</a>
        
      </div>
      <div class="icons-footer">
        <a href="#"><i class='icon bx bxl-linkedin-square' ></i></a>
        <a href="#"><i class='icon bx bxl-instagram-alt' ></i></a>
        <a href="#"><i class='icon bx bxl-facebook-square'></i></a>
      </div>
      </div>
    </div>
  
    </footer>
</body>
</html>
